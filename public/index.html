<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- PWA / iPhone écran d'accueil -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#27306B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Boutique" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              // Forcer l’activation d’un SW déjà en attente (ancienne config skipWaiting:false).
              function activerEnAttente(worker) {
                if (!worker) return;
                worker.postMessage({ type: 'SKIP_WAITING' });
              }
              if (reg.waiting) activerEnAttente(reg.waiting);
              reg.addEventListener('updatefound', function () {
                var nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', function () {
                  if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                    activerEnAttente(nw);
                  }
                });
              });
              // Chercher une mise à jour tout de suite (évite de rester bloqué sur un vieux precache).
              reg.update().catch(function () {});
            })
            .catch(function () {
              /* En local sans build Workbox, sw.js peut manquer : ce n’est pas bloquant. */
            });

          // Un seul reload quand le nouveau SW prend le contrôle.
          var rechargementSw = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (rechargementSw) return;
            rechargementSw = true;
            window.location.reload();
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      Activez JavaScript pour utiliser Boutique.
    </noscript>
    <div id="root"></div>
  </body>
</html>
